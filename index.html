<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #050510;
            --glass-bg: rgba(20, 20, 35, 0.4);
            --glass-border: rgba(255, 126, 179, 0.4);
            --neon-pink: #ff7eb3;
            --neon-cyan: #00f3ff;
            --text-main: #f0f0f0;
            --glass-shadow: 0 0 20px rgba(255, 126, 179, 0.2), inset 0 0 15px rgba(0, 243, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e, #0f0c29);
            background-size: 400% 400%;
            animation: cosmicFlow 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-main);
        }

        @keyframes cosmicFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 450px) {
            .app-container {
                height: 90vh;
                border-radius: 30px;
            }
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transform: scale(1.1) translateY(30px);
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
            z-index: 10;
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: linear-gradient(180deg, rgba(30, 25, 50, 0.6) 0%, rgba(15, 10, 30, 0.8) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--neon-cyan);
            border-radius: 20px;
            padding: 2.5rem 1.5rem;
            width: 100%;
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        h1 { 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem; 
            color: #fff; 
            text-shadow: 0 0 10px var(--neon-pink);
            margin-bottom: 0.5rem; 
            letter-spacing: 1px;
        }
        
        p { font-size: 0.95rem; color: #b0b5c9; line-height: 1.6; }

        /* Neon Buttons */
        button {
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.4), transparent);
            transition: all 0.4s ease;
        }

        button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 10px #fff;
            transform: translateY(-2px);
        }

        button:hover::before { left: 100%; }

        .emoji-large { font-size: 5rem; animation: floatHolo 4s ease-in-out infinite; filter: drop-shadow(0 0 15px rgba(255,255,255,0.5)); }
        .emoji-huge { font-size: 7rem; display: inline-block; }
        
        @keyframes floatHolo {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        .glow-active { animation: neonPulse 1.5s alternate infinite; }

        @keyframes neonPulse {
            from { filter: drop-shadow(0 0 10px #ff9a9e) drop-shadow(0 0 20px #ff9a9e); }
            to { filter: drop-shadow(0 0 20px #ff7eb3) drop-shadow(0 0 40px #ff7eb3); }
        }

        /* Balloon Grid */
        .balloon-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            margin-bottom: 10px;
        }

        .balloon-container {
            position: relative;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .balloon {
            font-size: 3rem;
            cursor: pointer;
            position: absolute;
            z-index: 2;
            filter: drop-shadow(0 0 10px rgba(255, 126, 179, 0.6));
        }

        .balloon-container:nth-child(even) .balloon { animation: floatHolo 3s infinite reverse; }
        .balloon-container:nth-child(odd) .balloon { animation: floatHolo 3.5s infinite; }

        .balloon.popped {
            transform: scale(1.5);
            opacity: 0;
            filter: blur(10px) brightness(2);
            transition: all 0.2s ease-out;
            pointer-events: none;
        }

        .hidden-word {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: var(--neon-pink);
            font-size: 0.9rem;
            text-shadow: 0 0 5px var(--neon-pink);
            z-index: 1;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .hidden-word.visible { opacity: 1; transform: translateY(0); }

        /* Swipeable Image Gallery */
        .gallery-container {
            width: 100%;
            height: 35vh;   /* scales with screen */
            max-height: 350px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--neon-cyan);
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.1);
            touch-action: pan-y;
            cursor: grab;
        }
        
        .gallery-container:active { cursor: grabbing; }

        .gallery-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .gallery-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.5);
            position: relative;
        }

        .gallery-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            opacity: 0.85;
            /* Filter removed from here so it doesn't apply to all images */
        }

        /* NEW CLASS: Pushes the image text to the bottom */
        .image-label {
            position: absolute;
            bottom: 25px; /* Sits right above the navigation dots */
            z-index: 2;
            font-size: 1rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); /* Ensures it's readable */
        }

        .gallery-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(0, 242, 255, 0.317) 1px, transparent 1px);
            background-size: 100% 10000px;
            pointer-events: none;
            z-index: 10;
        }

        .gallery-nav {
            position: absolute;
            bottom: 12px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 11;
        }

        .nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .nav-dot.active {
            background: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
            transform: scale(1.3);
        }

        .swipe-hint {
            font-size: 0.75rem;
            color: var(--neon-cyan);
            margin-bottom: 5px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            animation: pulseHint 2s infinite;
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .hidden-control { display: none; }

        /* Typewriter Cursor */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: var(--neon-cyan);
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Reel Video Styling */
        #surprise-reel {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 50;
            border-radius: inherit;
        }

    </style>
</head>
<body>

<div class="app-container">

    <div id="screen-1" class="screen active">
        <div class="glass-card">
            <div class="emoji-large">👸</div>
            <h1>SYSTEM ALERT: MADAM-JI DETECTED</h1>
            <p>Initializing birthday sequence 21.0...</p>
            <button onclick="startSequence()">ACCESS SURPRISE</button>
        </div>
    </div>

    <div id="screen-2" class="screen">
        <div class="glass-card">
            <div id="cake-display" class="emoji-huge" style="transition: all 0.5s;">🥞</div>
            <h1 id="cake-text">Constructing Cake...</h1>
            <button id="cake-btn" onclick="decorateCake()">SYNTHESIZE DECOR</button>
        </div>
    </div>

    <div id="screen-3" class="screen">
        <div class="glass-card">
            <h1>TARGET BALLOONS</h1>
            <p style="font-size: 0.8rem; color: var(--neon-cyan);">[Tap to detonate]</p>
            
            <div class="balloon-grid">
                <div class="balloon-container">
                    <span class="hidden-word">HELLO</span>
                    <div class="balloon" onclick="popBalloon(this)">🎈</div>
                </div>
                <div class="balloon-container">
                    <span class="hidden-word">MALKIN</span>
                    <div class="balloon" onclick="popBalloon(this)">🎈</div>
                </div>
                <div class="balloon-container">
                    <span class="hidden-word">SOMETHING'S</span>
                    <div class="balloon" onclick="popBalloon(this)">🎈</div>
                </div>
                <div class="balloon-container">
                    <span class="hidden-word">WAITING</span>
                    <div class="balloon" onclick="popBalloon(this)">🎈</div>
                </div>
            </div>

            <button id="balloon-next" class="hidden-control" onclick="nextScreen(3, 4)">PROCEED ➔</button>
        </div>
    </div>

    <div id="screen-4" class="screen">
        <div class="glass-card" style="padding-left: 1rem; padding-right: 1rem;">
            <h1>MEMORY LOG</h1>
            <p class="swipe-hint">« SWIPE TO BROWSE »</p>
            
            <div class="gallery-container" id="gallery">
                <div class="gallery-track" id="gallery-track">
                    
                    <div class="gallery-slide">
                        <img src="0d7db546da582196dd86c13745b9f3b0.jpg.jpeg" alt="Memory 1" style="filter: brightness(1.3);">
                        <span class="image-label">⮞</span>
                    </div>
                    <div class="gallery-slide">
                        <img src="IMG20251223195255.jpg.jpeg" alt="Memory 2">
                        <span class="image-label">⮜ ⮞</span>
                    </div>

                    <div class="gallery-slide">
                        <img src="9861b06c430bbe9b7a56550760640930.jpg.jpeg" alt="Memory 3">
                        <span class="image-label">⮜</span>
                    </div>

                </div>
                <div class="gallery-nav" id="gallery-dots">
                    <span class="nav-dot active"></span>
                    <span class="nav-dot"></span>
                    <span class="nav-dot"></span>
                </div>
            </div>

            <button onclick="startTypewriterAndNext()">DECRYPT MESSAGE</button>
        </div>
    </div>

    <div id="screen-5" class="screen">
        <div class="glass-card">
            <h1>TRANSMISSION:</h1>
            <p style="text-align: left; font-size: 0.95rem; min-height: 220px;">
                <span id="typewriter-text"></span><span class="cursor"></span>
            </p>
            <button id="msg-next-btn" style="opacity: 0; transition: opacity 0.5s;" onclick="nextScreen(5, 6)">PROCEED ➔</button>
        </div>
    </div>

    <div id="screen-6" class="screen">
        <video id="surprise-reel" src="bleh.mp4" playsinline></video>

        <div class="glass-card" id="final-card">
            <h1>FINAL PROTOCOL</h1>
            <div id="gift-box" class="emoji-huge" style="cursor: pointer; animation: floatHolo 2s infinite;" onclick="openGift()">🎁</div>
            <p id="gift-text">Tap to extract</p>
            <button id="replay-btn" class="hidden-control" onclick="location.reload()">REBOOT SEQUENCE</button>
        </div>
    </div>

</div>

<audio id="birthday_audio" src="flute_melody.mp3" preload="auto" loop></audio>

<script>
    const cyberColors = ['#00f3ff', '#ff7eb3', '#bf00ff', '#ffffff'];

    // --- NEW FUNCTION: Starts the sequence and plays audio ---
    function startSequence() {
        const audio = document.getElementById('birthday_audio');
        audio.volume = 0.1; // Keeps the volume low and soft
        
        // Play the audio. Because this is triggered by a click, the browser will allow it.
        let playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => {
                console.log("Audio play failed:", error);
            });
        }
        
        // Move to the next screen
        nextScreen(1, 2);
    }

    function nextScreen(currentId, nextId) {
        document.getElementById(`screen-${currentId}`).classList.remove('active');
        document.getElementById(`screen-${nextId}`).classList.add('active');
    }

    let cakeStage = 0;
    function decorateCake() {
        const display = document.getElementById('cake-display');
        const btn = document.getElementById('cake-btn');
        const text = document.getElementById('cake-text');

        if (cakeStage === 0) {
            display.style.transform = 'scale(0.8)';
            setTimeout(() => {
                display.innerText = '🎂';
                display.style.transform = 'scale(1.1)';
                text.innerText = 'Cake Synthesized.';
                btn.innerHTML = 'IGNITE CANDLE';
            }, 200);
            cakeStage++;
        } else if (cakeStage === 1) {
            display.innerText = '🕯️🎂';
            display.classList.add('glow-active');
            text.innerText = 'Sequence Active!';
            btn.innerHTML = 'PROCEED ➔';
            confetti({ particleCount: 50, spread: 60, colors: cyberColors, origin: { y: 0.6 }});
            cakeStage++;
        } else if (cakeStage === 2) {
            nextScreen(2, 3);
        }
    }

    let poppedCount = 0;
    function popBalloon(element) {
        if (element.classList.contains('popped')) return;
        
        element.classList.add('popped');
        element.previousElementSibling.classList.add('visible');
        poppedCount++;

        confetti({
            particleCount: 25,
            spread: 70,
            origin: { 
                x: element.getBoundingClientRect().left / window.innerWidth + 0.05,
                y: element.getBoundingClientRect().top / window.innerHeight + 0.05
            },
            colors: cyberColors,
            startVelocity: 20,
            gravity: 1.5
        });

        if (poppedCount === 4) {
            setTimeout(() => {
                document.getElementById('balloon-next').style.display = 'flex';
            }, 600);
        }
    }

    const gallery = document.getElementById('gallery');
    const track = document.getElementById('gallery-track');
    const dots = document.querySelectorAll('.nav-dot');
    const totalSlides = document.querySelectorAll('.gallery-slide').length;
    let currentSlide = 0;
    let startX = 0;
    let isDragging = false;

    function updateGallery() {
        track.style.transform = `translateX(-${currentSlide * 100}%)`;
        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === currentSlide);
        });
    }

    gallery.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        isDragging = true;
    });

    gallery.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        let currentX = e.touches[0].clientX;
        if(Math.abs(startX - currentX) > 10) {
             e.preventDefault();
        }
    }, { passive: false });

    gallery.addEventListener('touchend', (e) => {
        if (!isDragging) return;
        isDragging = false;
        let endX = e.changedTouches[0].clientX;
        let diff = startX - endX;

        if (diff > 50 && currentSlide < totalSlides - 1) {
            currentSlide++; 
        } else if (diff < -50 && currentSlide > 0) {
            currentSlide--; 
        }
        updateGallery();
    });

    gallery.addEventListener('mousedown', (e) => {
        startX = e.clientX;
        isDragging = true;
    });

    gallery.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
    });

    gallery.addEventListener('mouseup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        let diff = startX - e.clientX;

        if (diff > 50 && currentSlide < totalSlides - 1) {
            currentSlide++;
        } else if (diff < -50 && currentSlide > 0) {
            currentSlide--;
        }
        updateGallery();
    });

    gallery.addEventListener('mouseleave', () => {
        if (isDragging) {
            isDragging = false;
            updateGallery(); 
        }
    });

    const message = "Happy Birthday, Madam! You deserve all the happiness, love, and smiles in the world today and always. \n\nYou have this special way of making everything around you brighter. Let this day be brighter and happier and God bless you always!! \n\nHappy Birthday Love❤️";
    let i = 0;
    
    function startTypewriterAndNext() {
        nextScreen(4, 5);
        if (i === 0) {
            setTimeout(typeWriter, 800);
        }
    }

    function typeWriter() {
        if (i < message.length) {
            let char = message.charAt(i);
            if (char === '\n') {
                document.getElementById("typewriter-text").innerHTML += "<br>";
            } else {
                document.getElementById("typewriter-text").innerHTML += char;
            }
            i++;
            let speed = Math.random() * 30 + 20; 
            setTimeout(typeWriter, speed);
        } else {
            document.getElementById("msg-next-btn").style.opacity = 1;
            document.getElementById("msg-next-btn").style.pointerEvents = "auto";
        }
    }

    function openGift() {
        const gift = document.getElementById('gift-box');
        const reel = document.getElementById('surprise-reel');

        gift.style.animation = 'none';
        gift.style.transform = 'scale(0.5)';
        gift.onclick = null; // Prevent double-clicking

        // Fade to the video reel
        setTimeout(() => {
            reel.style.display = 'block';
            reel.play().catch(e => console.error("Autoplay prevented. User interaction required.", e));
        }, 300);

        // When the reel finishes playing, close it and trigger the final surprise
        reel.onended = () => {
            reel.style.display = 'none';
            triggerFinalSurprise();
        };
    }

    function triggerFinalSurprise() {
        const gift = document.getElementById('gift-box');
        const text = document.getElementById('gift-text');
        const card = document.getElementById('final-card');
        const btn = document.getElementById('replay-btn');

        gift.innerText = '🐻❤️';
        gift.style.transform = 'scale(1.2)';
        gift.classList.add('glow-active');
        
        card.querySelector('h1').innerText = 'SURPRISE COMPLETE';
        text.innerText = 'Hope you loved your digital surprise. System signing off.';
        btn.style.display = 'flex';

        var duration = 3 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 40, spread: 360, ticks: 60, zIndex: 100, colors: cyberColors };

        function randomInRange(min, max) { return Math.random() * (max - min) + min; }

        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);

            var particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount,
                origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
            }));
            confetti(Object.assign({}, defaults, { particleCount,
                origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
            }));
        }, 250);
    }

</script>

</body>
</html>
